# Vemory server configuration (INI).
# Load with: ./bin/vemory -c conf/vemory.ini
# A positional port argument overrides server.port.

[server]
port = 8888
bind = 0.0.0.0

[logging]
# trace | debug | info | warn | error | critical | off
level = info

[storage]
kv_reserve = 100000

[index]
default_capacity = 1024
# Semantic-cache entry limit; 0 disables LRU eviction (uint16 ~65k still applies)
max_entries = 0

[persistence]
# Snapshot directory (dump.rdb)
dir = data
# Load dump.rdb from dir on startup when the file exists
load_on_startup = false
# RESP AOF at dir/appendonly.aof (replay after RDB load)
aof = false
# AOF fsync: no | everysec (default) | always
aof_fsync = everysec
# AOF IO backend: auto (default) | thread | iouring
# auto/iouring: same-thread growable buffer + io_uring on the reactor; falls back to thread.
aof_io = auto
# Soft flush interval for inline buffer when below soft threshold (ms)
aof_flush_interval_ms = 1000
