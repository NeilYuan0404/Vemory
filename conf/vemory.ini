# Vemory server configuration (INI).
# Load with: ./bin/vemory -c conf/vemory.ini
# A positional port argument overrides server.port.

[server]
port = 6379
bind = 0.0.0.0

[logging]
# trace | debug | info | warn | error | critical | off
level = info

[storage]
kv_reserve = 100000

[index]
default_capacity = 1024

[persistence]
# Snapshot directory (dump.rdb)
dir = data
# Load dump.rdb from dir on startup when the file exists
load_on_startup = false
# Protobuf AOF at dir/appendonly.aof (replay after RDB load)
aof = false
# AOF fsync: no | everysec (default) | always
aof_fsync = everysec
# AOF IO backend: auto | thread | iouring
# Prefer thread for real use. iouring is experimental only (auto may pick it if liburing is present).
aof_io = thread
