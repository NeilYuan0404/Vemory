# Demo server with AOF enabled.
# ./bin/vemory -c demo/vemory.aof.ini

[server]
port = 8889
bind = 0.0.0.0

[logging]
level = info

[storage]
kv_reserve = 10000

[index]
default_capacity = 256
max_entries = 0

[persistence]
dir = demo/data_aof
load_on_startup = true
aof = true
aof_fsync = everysec
aof_io = auto
aof_flush_interval_ms = 1000
